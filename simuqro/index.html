:root[data-theme="dark"]{--bg:#10131a;--fg:#e8ebf2;--muted:#9aa3b5;--card:#191d27;--line:#2a3040;--accent:#6b97ff;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--display);min-height:100vh;display:grid;place-items:center;

.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-size:24px;margin:0;text-wrap:balance}
.qr{background:#fff;padding:18px;border-radius:12px;width:100%;max-width:340px;justify-self:center;box-sizing:border-box}
.qr svg{display:block;width:100%;height:auto}
.hint{color:var(--muted);font-size:14px;margin:0}
.url{font-family:var(--mono);font-size:12px;word-break:break-all;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px 12px;text-align:left;user-select:all}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
a.btn,button{font:600 14px var(--display);padding:10px 16px;border-radius:10px;border:1px solid var(--accent);cursor:pointer;text-decoration:none}
a.btn{background:var(--accent);color:#fff}
button{background:transparent;color:var(--accent)}
a.btn:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
